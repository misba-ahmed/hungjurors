name: Inspect roster photo changes
on:
  push:
    branches: [roster-photos-refresh-20260930]
    paths: ['.github/workflows/roster-photo-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fetch missing player references
        run: |
          node <<'ROSTER'
          (async()=>{
           for(const id of [2576925,4887558]){
            const r=await fetch('https://a.espncdn.com/i/headshots/nfl/players/full/'+id+'.png');if(!r.ok)throw Error('Headshot HTTP '+r.status);
            console.log('HEADSHOT '+id+' '+Buffer.from(await r.arrayBuffer()).toString('base64'));
           }
          })().catch(e=>{console.error(e);process.exitCode=1;});
          ROSTER
