name: Verify section gestures
on:
  push:
    branches: [main, fix-desktop-section-wheel, fix-continuous-trackpad-scroll, shared-matchup-scrolling]
    paths:
      - scripts/section-scroll.js
      - styles/section-scroll.css
      - scripts/prepare-site.mjs
      - scripts/prepare-live-display.mjs
      - scripts/live-updates.js
      - scripts/test-section-scroll.mjs
      - scripts/matchup-navigation.js
      - scripts/challenge-live.js
      - styles/season-challenges.css
      - scripts/test-desktop-section-wheel.mjs
      - scripts/test-trackpad-site.mjs
      - scripts/test-roster-swipe.mjs
      - scripts/test-challenge-swipe.mjs
      - .github/workflows/test-section-gestures.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  section-gestures:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install chromium webkit --with-deps
      - name: Verify existing lineup behavior
        run: |
          node scripts/test-lineup-rules.mjs
          node scripts/test-lineup-status.mjs
          node scripts/test-lineup-live-scores.mjs
          node scripts/test-lineup-spotlight.mjs
      - name: Verify built site scrolling
        run: node scripts/test-trackpad-site.mjs
      - name: Verify touch and desktop trackpad navigation
        run: |
          node scripts/test-roster-swipe.mjs
          node scripts/test-challenge-swipe.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gesture-proof
          path: gesture-proof/

