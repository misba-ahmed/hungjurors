name: Verify scheduled browser feed
on:
  push:
    branches: [codex/restore-vegas-browser-feed]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Test feed contracts
        run: node scripts/test-vegas-feed.mjs
      - name: Fetch and validate actual browser feed
        run: node scripts/check-live-vegas-feed.mjs
