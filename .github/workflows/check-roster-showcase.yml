name: Verify interactive roster showcase
on:
  push:
    branches: ["feat/interactive-roster-showcase"]
    paths: ["scripts/team-photos.js", "styles/team-photos.css", "scripts/prepare-site.mjs", "scripts/check-roster-showcase.mjs", ".github/workflows/check-roster-showcase.yml"]
permissions:
  contents: write
jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium webkit --with-deps
      - run: node scripts/check-roster-showcase.mjs
      - name: Save showcase previews
        if: always()
        run: |
          git config user.name "Showcase preview"
          git config user.email "preview@users.noreply.github.com"
          test -d showcase-preview || exit 0
          git add showcase-preview
          git diff --cached --quiet || git commit -m "Save interactive roster showcase previews"
          git push origin HEAD:refs/heads/feat/interactive-roster-showcase
