name: Inspect ESPN live contract
on:
  push:
    branches: [inspect-espn-live-sep28]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/inspect-espn-live.mjs
