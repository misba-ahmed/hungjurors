name: Diagnose deployed Trade Desk
on:
  push:
    branches: ['codex/diagnose-trade-worker']
    paths: ['.github/workflows/diagnose-trade-worker.yml']
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Inspect current NFL schedule
        run: |
          node --input-type=module <<'NODE'
          for(const week of [3,15]){
            const url='https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=2026&seasontype=2&week='+week+'&limit=100';
            const r=await fetch(url,{signal:AbortSignal.timeout(15000)});
            const body=await r.json();console.log(JSON.stringify({week,status:r.status,cors:r.headers.get('access-control-allow-origin'),season:body.season,events:body.events?.length,sample:body.events?.slice(0,1).map(e=>({id:e.id,name:e.name,season:e.season,week:e.week}))}));
          }
          NODE
