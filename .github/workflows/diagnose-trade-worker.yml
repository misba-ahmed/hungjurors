name: Diagnose deployed Trade Desk
on:
  push:
    branches: ['codex/diagnose-trade-worker']
    paths: ['.github/workflows/diagnose-trade-worker.yml']
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install chromium --with-deps
      - name: Inspect the selected live trade and source loading
        run: |
          cat > diagnose.mjs <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          page.on('pageerror',e=>console.log('PAGE_ERROR',e.message.slice(0,300)));
          await page.goto('https://hungjurors.com/#roster-strength',{waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForFunction(()=>window.HJTD&&typeof HJ_LEAGUE_STATE!=='undefined'&&HJ_LEAGUE_STATE.data?.teams?.length,{timeout:90000});
          await page.evaluate(async()=>{
           await window.HJMV.load();
           const teams=HJ_LEAGUE_STATE.data.teams,manager=t=>hjMatchManager(t,HJ_LEAGUE_STATE.data);
           const a=teams.find(t=>manager(t)==='MISBA'),b=teams.find(t=>manager(t)==='CESAR');
           if(!a||!b)throw Error('Managers not found');
           const select=(team,names)=>hjRosterEntries(team).filter(e=>names.includes(hjPlayer(e).fullName)).map(e=>String(hjPlayer(e).id));
           HJTD.a=String(a.id);HJTD.b=String(b.id);
           HJTD.give=new Set(select(a,['Jalen Coker','Dalton Schultz']));HJTD.get=new Set(select(b,['Chuba Hubbard']));
           if(HJTD.give.size!==2||HJTD.get.size!==1)throw Error('Trade not found on selected rosters');
           HJ_HQ_STATE.activeTab='strength';HJ_STRENGTH_STATE.view='trade';hjRerenderStrength();
          });
          await page.waitForTimeout(3000);
          const inspect=()=>page.evaluate(()=>{
           const trade=HJTD.buildResearchTrade();
           const names=['Chuba Hubbard','Jalen Coker','Dalton Schultz'];
           const entries=HJ_LEAGUE_STATE.data.teams.flatMap(hjRosterEntries).filter(e=>names.includes(hjPlayer(e).fullName));
           return {trade,week:hjCurrentWeek(),seasonReady:HJ_MATH_SEASON.ready,seasonCount:HJ_MATH_SEASON.byId.size,
            projectionsLoaded:HJ_PROJECTION_STATE.loaded,
            vegasSeasonRows:HJ_PROJECTION_STATE.season?.rows?.length,
            pffLoaded:!!hjPffFeed.data,pffError:hjPffFeed.error,
            schedules:[...pcScheduleValue.values()].filter(g=>Number(g.season)===Number(NFL_SEASON)).length,
            players:entries.map(e=>({name:hjPlayer(e).fullName,espn:hj6Projection(e,'espn','season',hjCurrentWeek(),NFL_SEASON),
            vegas:hj6Projection(e,'vegas','season',hjCurrentWeek(),NFL_SEASON),grade:hjPffEntryGrade(e)})),
            factors:[...document.querySelectorAll('.td-score-row')].map(n=>n.textContent.trim())};
          });
          const initial=await inspect();console.log('BEFORE',JSON.stringify(initial));
          const response=await page.evaluate(async trade=>{
           const response=await fetch('https://hungjurors-trade-analysis.misbauddin-ahmed.workers.dev/gemini',
            {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(trade),signal:AbortSignal.timeout(95000)});
           const text=await response.text();return {status:response.status,body:response.ok?{length:text.length,fields:Object.keys(JSON.parse(text))}:text};
          },initial.trade);
          console.log('ACTUAL_TRADE_RESPONSE',JSON.stringify(response));
          await page.evaluate(async()=>{await Promise.allSettled([hjMathLoadRosterSeasonProjections(HJ_LEAGUE_STATE.data),hjEnsureProjectionSources(),hjPffLoadFeed()]);hjRerenderStrength();});
          const after=await inspect();delete after.trade;console.log('AFTER_SOURCE_LOAD',JSON.stringify(after));
          await browser.close();
          
          NODE
          node diagnose.mjs
