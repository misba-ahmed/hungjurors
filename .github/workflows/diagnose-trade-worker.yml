name: Diagnose deployed Trade Desk
on:
  push:
    branches: ['codex/diagnose-trade-worker']
    paths: ['.github/workflows/diagnose-trade-worker.yml']
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Wait for the deployed server
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const base='https://hungjurors-trade-analysis.misbauddin-ahmed.workers.dev';
          const headers={Origin:'https://hungjurors.com','Content-Type':'application/json'};
          let ready=false;
          for(let i=0;i<24;i++){
           const r=await fetch(base+'/health',{headers,signal:AbortSignal.timeout(10000)});
           const h=await r.json();
           if(h.ready&&h.release==='20260924-direct-analysis'){ready=true;break}
           await new Promise(resolve=>setTimeout(resolve,15000));
          }
          if(!ready)throw Error('New server deployment has not become active');
          NODE
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Generate and display one report through the live page
        run: |
          node --input-type=module <<'NODE'
          const kill=setTimeout(()=>{console.error('UI deadline');process.exit(1)},180000);
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          page.on('pageerror',e=>console.log('PAGE_ERROR',e.message.slice(0,300)));
          await page.goto('https://hungjurors.com/#roster-strength',{waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForFunction(()=>window.HJTD&&typeof HJ_LEAGUE_STATE!=='undefined'&&HJ_LEAGUE_STATE.data?.teams?.length,{timeout:90000});
          await page.evaluate(async()=>{
           await window.HJMV.load();
           const teams=HJ_LEAGUE_STATE.data.teams,manager=t=>hjMatchManager(t,HJ_LEAGUE_STATE.data);
           const a=teams.find(t=>manager(t)==='MISBA'),b=teams.find(t=>manager(t)==='CESAR');
           if(!a||!b)throw Error('Managers not found');
           const select=(team,names)=>hjRosterEntries(team).filter(e=>names.includes(hjPlayer(e).fullName)).map(e=>String(hjPlayer(e).id));
           HJTD.a=String(a.id);HJTD.b=String(b.id);
           HJTD.give=new Set(select(a,['Jalen Coker','Dalton Schultz']));HJTD.get=new Set(select(b,['Chuba Hubbard']));
           if(HJTD.give.size!==2||HJTD.get.size!==1)throw Error('Trade not found on selected rosters');
           HJ_HQ_STATE.activeTab='strength';HJ_STRENGTH_STATE.view='trade';hjRerenderStrength();
          });
          
          await page.waitForFunction(()=>{const rows=[...document.querySelectorAll('.td-score-row')];return rows.find(n=>n.textContent.includes('Rest of season'))?.querySelector('.td-score-note')?.textContent&&rows.find(n=>n.textContent.includes('Play quality'))?.querySelector('.td-score-note')?.textContent},null,{timeout:45000});
          console.log('SCORECARD',JSON.stringify(await page.evaluate(()=>[...document.querySelectorAll('.td-score-row')].map(n=>n.textContent.trim()))));
          const started=Date.now();
          const responsePromise=page.waitForResponse(r=>r.url().endsWith('/gemini'),{timeout:110000});
          await page.evaluate(()=>document.querySelector('[data-td-analysis-start]').click());
          const response=await responsePromise;
          const input=response.request().postDataJSON();
          console.log('REPORT_INPUT',JSON.stringify({bytes:JSON.stringify(input).length,newsItems:input.evidence?.newsItems,contextPlayers:input.context?.players?.length}));
          const result=await response.text();
          console.log('REPORT_RESPONSE',JSON.stringify({status:response.status(),ms:Date.now()-started,body:result}));
          if(!response.ok()){console.log('NO_GENERATED_REPORT');await browser.close();clearTimeout(kill);process.exit(0)}
          await page.waitForFunction(()=>document.querySelector('.td-sec-summary')?.textContent,null,{timeout:15000});
          console.log('UI_REPORT',JSON.stringify(await page.evaluate(()=>({summary:document.querySelector('.td-sec-summary')?.textContent,
          sections:[...document.querySelectorAll('.td-sec h4')].map(n=>n.textContent),reportWidth:document.querySelector('.td-report')?.getBoundingClientRect().width,
          overflow:document.querySelector('.td-report')?.scrollWidth>document.querySelector('.td-report')?.clientWidth}))));
          await browser.close();clearTimeout(kill);
          NODE
