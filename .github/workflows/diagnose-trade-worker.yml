name: Diagnose deployed Trade Desk
on:
  push:
    branches: ['codex/diagnose-trade-worker']
    paths: ['.github/workflows/diagnose-trade-worker.yml']
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Wait for release and request one real report
        run: |
          node --input-type=module <<'NODE'
          import {writeFileSync} from 'node:fs';
          const base='https://hungjurors-trade-analysis.misbauddin-ahmed.workers.dev';
          const headers={Origin:'https://hungjurors.com','Content-Type':'application/json'};
          let ready=false;
          for(let i=0;i<24;i++){
           const r=await fetch(base+'/health',{headers,signal:AbortSignal.timeout(10000)});
           const h=await r.json();
           if(h.ready&&h.release==='20260924-free-failover'){ready=true;break}
           await new Promise(resolve=>setTimeout(resolve,15000));
          }
          if(!ready)throw Error('New server deployment has not become active');
          const trade={"protocol":"hj-trade-search-v1","season":2026,"week":3,"league":{"teams":10,"ppr":1,"teReceptionBonus":0.5,"playoffTeams":4,"playoffWeeks":[15,16],"regularSeasonWeeks":14,"lineupSlots":{"0":1,"1":0,"2":2,"3":0,"4":2,"5":0,"6":1,"7":0,"8":0,"9":0,"10":0,"11":0,"12":0,"13":0,"14":0,"15":0,"16":1,"17":1,"18":0,"19":0,"20":7,"21":1,"22":0,"23":1,"24":0}},"managers":[{"id":"1","name":"MISBA","record":{"wins":0,"losses":2,"ties":0},"rosterCapacity":16,"roster":[{"id":"4426515","name":"Puka Nacua","position":"WR","team":"LAR","marketValue":7904,"marketPositionRank":4,"marketChange30Days":-1244,"rosterSlotId":20,"ir":false,"injuryStatus":"QUESTIONABLE"},{"id":"4362238","name":"Chase Brown","position":"RB","team":"CIN","marketValue":5992,"marketPositionRank":9,"marketChange30Days":-695,"rosterSlotId":2,"ir":false,"injuryStatus":"ACTIVE"},{"id":"4047646","name":"A.J. Brown","position":"WR","team":"NE","marketValue":2435,"marketPositionRank":23,"marketChange30Days":-3633,"rosterSlotId":21,"ir":true,"injuryStatus":"INJURY_RESERVE"},{"id":"4431459","name":"Tyler Warren","position":"TE","team":"IND","marketValue":2593,"marketPositionRank":4,"marketChange30Days":-1055,"rosterSlotId":20,"ir":false,"injuryStatus":"ACTIVE"},{"id":"4259545","name":"D'Andre Swift","position":"RB","team":"CHI","marketValue":3930,"marketPositionRank":17,"marketChange30Days":813,"rosterSlotId":2,"ir":false,"injuryStatus":"ACTIVE"},{"id":"4372016","name":"Jaylen Waddle","position":"WR","team":"DEN","marketValue":2868,"marketPositionRank":18,"marketChange30Days":-412,"rosterSlotId":23,"ir":false,"injuryStatus":"ACTIVE"},{"id":"4685278","name":"Luther Burden III","position":"WR","team":"CHI","marketValue":1206,"marketPositionRank":30,"marketChange30Days":-1341,"rosterSlotId":20,"ir":false,"injuryStatus":"ACTIVE"},{"id":"4572680","name":"Tucker Kraft","position":"TE","team":"GB","marketValue":1755,"marketPositionRank":8,"marketChange30Days":-485,"rosterSlotId":20,"ir":false,"injuryStatus":"ACTIVE"},{"id":"4432620","name":"Parker Washington","position":"WR","team":"JAX","marketValue":3452,"marketPositionRank":15,"marketChange30Days":1743,"rosterSlotId":4,"ir":false,"injuryStatus":"ACTIVE"},{"id":"4047365","name":"Josh Jacobs","position":"RB","team":"GB","marketValue":1769,"marketPositionRank":27,"marketChange30Days":-2419,"rosterSlotId":20,"ir":false,"injuryStatus":"DAY_TO_DAY"},{"id":"4688813","name":"Josh Downs","position":"WR","team":"IND","marketValue":982,"marketPositionRank":35,"marketChange30Days":121,"rosterSlotId":20,"ir":false,"injuryStatus":"ACTIVE"},{"id":"4695883","name":"Jalen Coker","position":"WR","team":"CAR","marketValue":1671,"marketPositionRank":27,"marketChange30Days":1210,"rosterSlotId":4,"ir":false,"injuryStatus":"QUESTIONABLE"},{"id":"4832800","name":"Denzel Boston","position":"WR","team":"CLE","marketValue":1101,"marketPositionRank":33,"marketChange30Days":828,"rosterSlotId":20,"ir":false,"injuryStatus":"ACTIVE"},{"id":"4360234","name":"Evan McPherson","position":"K","team":"CIN","marketValue":null,"marketPositionRank":null,"marketChange30Days":null,"rosterSlotId":17,"ir":false,"injuryStatus":"ACTIVE"},{"id":"-16016","name":"Vikings D/ST","position":"D/ST","team":"MIN","marketValue":null,"marketPositionRank":null,"marketChange30Days":null,"rosterSlotId":16,"ir":false,"injuryStatus":""},{"id":"3917315","name":"Kyler Murray","position":"QB","team":"MIN","marketValue":390,"marketPositionRank":21,"marketChange30Days":-151,"rosterSlotId":0,"ir":false,"injuryStatus":"ACTIVE"},{"id":"3117256","name":"Dalton Schultz","position":"TE","team":"HOU","marketValue":809,"marketPositionRank":13,"marketChange30Days":524,"rosterSlotId":6,"ir":false,"injuryStatus":"ACTIVE"}],"sends":["4695883","3117256"]},{"id":"7","name":"CESAR","record":{"wins":1,"losses":1,"ties":0},"rosterCapacity":16,"roster":[{"id":"4242335","name":"Jonathan Taylor","position":"RB","team":"IND","marketValue":9036,"marketPositionRank":3,"marketChange30Days":422,"rosterSlotId":2,"ir":false,"injuryStatus":"ACTIVE"},{"id":"3929630","name":"Saquon Barkley","position":"RB","team":"PHI","marketValue":5434,"marketPositionRank":12,"marketChange30Days":-1577,"rosterSlotId":2,"ir":false,"injuryStatus":"QUESTIONABLE"},{"id":"4426354","name":"George Pickens","position":"WR","team":"DAL","marketValue":4122,"marketPositionRank":12,"marketChange30Days":-1149,"rosterSlotId":4,"ir":false,"injuryStatus":"ACTIVE"},{"id":"4723086","name":"Colston Loveland","position":"TE","team":"CHI","marketValue":1610,"marketPositionRank":9,"marketChange30Days":-2131,"rosterSlotId":6,"ir":false,"injuryStatus":"ACTIVE"},{"id":"3916387","name":"Lamar Jackson","position":"QB","team":"BAL","marketValue":3606,"marketPositionRank":2,"marketChange30Days":-543,"rosterSlotId":0,"ir":false,"injuryStatus":"ACTIVE"},{"id":"4239993","name":"Tee Higgins","position":"WR","team":"CIN","marketValue":2833,"marketPositionRank":20,"marketChange30Days":-970,"rosterSlotId":4,"ir":false,"injuryStatus":"ACTIVE"},{"id":"4685512","name":"Jadarian Price","position":"RB","team":"SEA","marketValue":1794,"marketPositionRank":26,"marketChange30Days":-840,"rosterSlotId":20,"ir":false,"injuryStatus":"QUESTIONABLE"},{"id":"4038815","name":"Rico Dowdle","position":"RB","team":"PIT","marketValue":776,"marketPositionRank":35,"marketChange30Days":-687,"rosterSlotId":20,"ir":false,"injuryStatus":"QUESTIONABLE"},{"id":"2976212","name":"Stefon Diggs","position":"WR","team":"WAS","marketValue":1324,"marketPositionRank":29,"marketChange30Days":317,"rosterSlotId":20,"ir":false,"injuryStatus":"ACTIVE"},{"id":"4429205","name":"Jordan Addison","position":"WR","team":"MIN","marketValue":489,"marketPositionRank":50,"marketChange30Days":-316,"rosterSlotId":20,"ir":false,"injuryStatus":"ACTIVE"},{"id":"2473037","name":"Jason Myers","position":"K","team":"SEA","marketValue":null,"marketPositionRank":null,"marketChange30Days":null,"rosterSlotId":17,"ir":false,"injuryStatus":"ACTIVE"},{"id":"4569587","name":"Wan'Dale Robinson","position":"WR","team":"TEN","marketValue":240,"marketPositionRank":60,"marketChange30Days":-537,"rosterSlotId":20,"ir":false,"injuryStatus":"ACTIVE"},{"id":"3046779","name":"Jared Goff","position":"QB","team":"DET","marketValue":1254,"marketPositionRank":11,"marketChange30Days":574,"rosterSlotId":20,"ir":false,"injuryStatus":"ACTIVE"},{"id":"4241416","name":"Chuba Hubbard","position":"RB","team":"CAR","marketValue":3061,"marketPositionRank":21,"marketChange30Days":1642,"rosterSlotId":23,"ir":false,"injuryStatus":"ACTIVE"},{"id":"4036133","name":"T.J. Hockenson","position":"TE","team":"MIN","marketValue":188,"marketPositionRank":20,"marketChange30Days":-10,"rosterSlotId":20,"ir":false,"injuryStatus":"ACTIVE"},{"id":"-16017","name":"Patriots D/ST","position":"D/ST","team":"NE","marketValue":null,"marketPositionRank":null,"marketChange30Days":null,"rosterSlotId":16,"ir":false,"injuryStatus":""}],"sends":["4241416"]}],"market":{"sentA":2480,"sentB":3061,"gapFraction":0.18980725253185235,"asOf":1790269883818}};
          const started=Date.now();
          const r=await fetch(base+'/gemini',{method:'POST',headers,body:JSON.stringify(trade),signal:AbortSignal.timeout(100000)});
          const text=await r.text();
          console.log('REPORT_RESPONSE',JSON.stringify({status:r.status,ms:Date.now()-started,body:text}));
          if(r.ok)writeFileSync('report.json',text);
          NODE
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Check live scorecard and render the same report without another model call
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,existsSync} from 'node:fs';
          const kill=setTimeout(()=>{console.error('UI deadline');process.exit(1)},90000);
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:390,height:844}});
          page.on('pageerror',e=>console.log('PAGE_ERROR',e.message.slice(0,300)));
          await page.goto('https://hungjurors.com/#roster-strength',{waitUntil:'domcontentloaded',timeout:90000});
          await page.waitForFunction(()=>window.HJTD&&typeof HJ_LEAGUE_STATE!=='undefined'&&HJ_LEAGUE_STATE.data?.teams?.length,{timeout:90000});
          await page.evaluate(async()=>{
           await window.HJMV.load();
           const teams=HJ_LEAGUE_STATE.data.teams,manager=t=>hjMatchManager(t,HJ_LEAGUE_STATE.data);
           const a=teams.find(t=>manager(t)==='MISBA'),b=teams.find(t=>manager(t)==='CESAR');
           if(!a||!b)throw Error('Managers not found');
           const select=(team,names)=>hjRosterEntries(team).filter(e=>names.includes(hjPlayer(e).fullName)).map(e=>String(hjPlayer(e).id));
           HJTD.a=String(a.id);HJTD.b=String(b.id);
           HJTD.give=new Set(select(a,['Jalen Coker','Dalton Schultz']));HJTD.get=new Set(select(b,['Chuba Hubbard']));
           if(HJTD.give.size!==2||HJTD.get.size!==1)throw Error('Trade not found on selected rosters');
           HJ_HQ_STATE.activeTab='strength';HJ_STRENGTH_STATE.view='trade';hjRerenderStrength();
          });
          
          await page.waitForFunction(()=>{const rows=[...document.querySelectorAll('.td-score-row')];return rows.find(n=>n.textContent.includes('Rest of season'))?.querySelector('.td-score-note')?.textContent&&rows.find(n=>n.textContent.includes('Play quality'))?.querySelector('.td-score-note')?.textContent},null,{timeout:45000});
          console.log('SCORECARD',JSON.stringify(await page.evaluate(()=>[...document.querySelectorAll('.td-score-row')].map(n=>n.textContent.trim()))));
          if(!existsSync('report.json')){console.log('NO_GENERATED_REPORT');await browser.close();clearTimeout(kill);process.exit(0)}
          const report=readFileSync('report.json','utf8');
          await page.route('**/gemini',route=>route.fulfill({status:200,contentType:'application/json',body:report}));
          await page.evaluate(()=>document.querySelector('[data-td-analysis-start]').click());
          await page.waitForFunction(()=>document.querySelector('.td-sec-summary')?.textContent,null,{timeout:15000});
          console.log('UI_REPORT',JSON.stringify(await page.evaluate(()=>({summary:document.querySelector('.td-sec-summary')?.textContent,
          sections:[...document.querySelectorAll('.td-sec h4')].map(n=>n.textContent),reportWidth:document.querySelector('.td-report')?.getBoundingClientRect().width,
          overflow:document.querySelector('.td-report')?.scrollWidth>document.querySelector('.td-report')?.clientWidth}))));
          await browser.close();clearTimeout(kill);
          NODE
