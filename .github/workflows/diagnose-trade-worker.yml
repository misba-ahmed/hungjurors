name: Diagnose deployed Trade Desk
on:
  push:
    branches: ['codex/diagnose-trade-worker']
    paths: ['.github/workflows/diagnose-trade-worker.yml']
permissions:
  contents: read
jobs:
  endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Inspect endpoint without generating an analysis
        run: |
          node --input-type=module <<'NODE'
          const base='https://hungjurors-trade-analysis.misbauddin-ahmed.workers.dev';
          const headers={Origin:'https://hungjurors.com'};
          for(const [path,method,body] of [['/health','GET'],['/gemini','OPTIONS'],['/gemini','POST','{}']]){
            const response=await fetch(base+path,{method,headers:{...headers,'Content-Type':'application/json'},body,signal:AbortSignal.timeout(15000)});
            console.log(JSON.stringify({path,method,status:response.status,cors:response.headers.get('access-control-allow-origin'),body:(await response.text()).slice(0,1500)}));
          }
          NODE
