name: Trade startup diagnosis
on:
  push:
    branches: [trade-desk-webllm-debug]
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install chromium webkit --with-deps
      - run: node scripts/check-trade-startup.mjs
