name: Inspect mobile rendering
on:
  push:
    branches: [zoom-live-diagnostic]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright
      - run: xvfb-run -a node scripts/diagnose-live-zoom.mjs
