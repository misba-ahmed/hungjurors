name: Prepare roster photos
on:
  push:
    branches: [zoom-live-diagnostic]
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false sharp
      - run: node scripts/diagnose-live-zoom.mjs
