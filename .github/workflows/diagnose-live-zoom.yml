name: Inspect mobile rendering
on:
  push:
    branches: [zoom-live-diagnostic]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright
      - run: HJ_BROWSER_EXECUTABLE=/usr/bin/google-chrome node scripts/test-matchup-layout.mjs
