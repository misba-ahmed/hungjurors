name: Check challenge entrances
on:
  push:
    branches: [manager-suit-artwork]
    paths: ['.challenge-motion/**', '.github/workflows/challenge-motion.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/test-challenges.mjs
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install chromium
      - run: node .challenge-motion/check.mjs
