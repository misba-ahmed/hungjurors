name: Kat face references
on:
  push:
    branches: ["fix/kat-player-likenesses"]
    paths: ["scripts/kat-face-references.mjs", ".github/workflows/kat-face-references.yml"]
permissions:
  contents: write
jobs:
  references:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false sharp@0.34.5
      - run: node scripts/kat-face-references.mjs
      - run: |
          git config user.name "Roster photo assets"
          git config user.email "preview@users.noreply.github.com"
          git add face-preview
          git commit -m "Prepare current player headshot references"
          git push origin HEAD:refs/heads/fix/kat-player-likenesses
