name: Verify lineup live scores
on:
  push:
    branches: [lineup-live-scores]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node scripts/test-lineup-live-scores.mjs
