name: Verify zoom rendering
on:
  push:
    branches: [mobile-zoom-diagnosis]
    paths: ['scripts/folder-artwork.js', 'scripts/verify-zoom-rendering.mjs', '.github/workflows/zoom-diagnosis.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright sharp
      - run: npx playwright install --with-deps webkit
      - run: node scripts/verify-zoom-rendering.mjs
      - if: always()
        run: |
          git config user.name "misba-ahmed"
          git config user.email "misbauddin.ahmed@gmail.com"
          git add .zoom
          git commit -m "Record zoom rendering comparison [skip ci]"
          git pull --rebase origin mobile-zoom-diagnosis
          git push origin HEAD:mobile-zoom-diagnosis
