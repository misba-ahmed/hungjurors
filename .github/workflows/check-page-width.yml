name: Check mobile page width
on:
  push:
    branches: ["fix/mobile-page-overflow"]
    paths: ["styles/team-photos.css", "scripts/prepare-site.mjs", "scripts/check-page-width.mjs", ".github/workflows/check-page-width.yml"]
permissions:
  contents: write
jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium webkit --with-deps
      - run: node scripts/check-page-width.mjs
      - name: Save page width check
        if: always()
        run: |
          git config user.name "Showcase preview"
          git config user.email "preview@users.noreply.github.com"
          test -d overflow-preview || exit 0
          git add overflow-preview
          git diff --cached --quiet || git commit -m "Save page width check"
          git push origin HEAD:refs/heads/fix/mobile-page-overflow
