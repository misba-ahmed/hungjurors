name: Prepare additional crutch poses
on:
  push:
    branches: [lineup-crutches-oct2]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false sharp
      - run: node .crutches/build.mjs
      - run: |
          node scripts/test-lineup-rules.mjs
          node scripts/test-lineup-status.mjs
          node scripts/test-lineup-live-scores.mjs
      - run: |
          git config user.name "misba-ahmed"
          git config user.email "misbauddin.ahmed@gmail.com"
          git add assets/team-photos .crutches
          git commit -m "Prepare six additional crutch figures"
          git push origin HEAD:lineup-crutches-oct2
