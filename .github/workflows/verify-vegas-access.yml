name: Verify Vegas runner access (no deployment)
on:
  push:
    branches: [codex/verify-vegas-runner-access]
    paths:
      - scripts/verify-vegas-access.mjs
      - .github/workflows/verify-vegas-access.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install the existing browser version
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/hj-vegas-browser" --no-audit --no-fund --package-lock=false playwright@1.63.0
          node "$RUNNER_TEMP/hj-vegas-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test actual collection with one passive wait
        env:
          VEGAS_PLAYWRIGHT_MODULE: ${{ runner.temp }}/hj-vegas-browser/node_modules/playwright/index.mjs
        run: node scripts/verify-vegas-access.mjs
      - name: Save collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vegas-access-evidence
          path: vegas-access-check/
          if-no-files-found: warn
          retention-days: 7
