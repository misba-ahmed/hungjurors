name: Prepare gold crest app icons
on:
  push:
    branches: ["fix/gold-crest-app-icon"]
    paths: ["scripts/build-app-icons.mjs", ".github/workflows/prepare-crest-icons.yml"]
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false sharp@0.34.5 potrace@2.1.8
      - name: Render original crest and verify
        run: |
          node scripts/build-app-icons.mjs
          node scripts/build-app-icons.mjs --check
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          cp *.png _site/
          node scripts/prepare-site.mjs _site/index.html
          node scripts/test-app-icons.mjs _site
          mkdir -p icon-preview
          base64 -w0 apple-touch-icon-hung-jurors-v2.png > icon-preview/apple.base64.txt
          base64 -w0 hung-jurors-icon-512-v2.png > icon-preview/icon.base64.txt
      - name: Save original crest icons
        run: |
          git config user.name "Icon build"
          git config user.email "preview@users.noreply.github.com"
          git add assets/brand *.png icon-preview
          git commit -m "Render gold crest icons on site navy"
          git push origin HEAD:refs/heads/fix/gold-crest-app-icon
