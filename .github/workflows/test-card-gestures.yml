name: Verify card gestures
on:
  push:
    branches: [card-gestures-preview]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gesture-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install chromium webkit --with-deps
      - run: node scripts/test-card-gestures.mjs
