name: Verify compact roster banner
on:
  push:
    branches: ["fix/compact-roster-banner"]
    paths: ["styles/team-photos.css", "scripts/prepare-site.mjs", "scripts/check-roster-spacing.mjs", ".github/workflows/check-roster-spacing.yml"]
permissions:
  contents: write
jobs:
  showcase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium webkit --with-deps
      - run: node scripts/check-roster-spacing.mjs
      - name: Save compact banner previews
        if: always()
        run: |
          git config user.name "Showcase preview"
          git config user.email "preview@users.noreply.github.com"
          test -d spacing-preview || exit 0
          git add spacing-preview
          git diff --cached --quiet || git commit -m "Save compact banner previews"
          git push origin HEAD:refs/heads/fix/compact-roster-banner
