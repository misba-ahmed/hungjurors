name: Verify home screen icons
on:
  push:
    branches: [site-display-fixes, main]
    paths:
      - 'index.html'
      - '*.png'
      - '*.webmanifest'
      - 'scripts/*app-icons.mjs'
      - 'scripts/prepare-site.mjs'
      - '.github/workflows/test-icons.yml'
permissions:
  contents: read
jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install image verification tool
        run: npm install --no-save --package-lock=false sharp@0.34.5
      - name: Verify icons match the homepage logo
        run: node scripts/build-app-icons.mjs --check
      - name: Verify the staged site includes every icon
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          node scripts/prepare-site.mjs _site/index.html
          node scripts/test-app-icons.mjs _site
      - name: Verify the published icon responses
        if: github.ref == 'refs/heads/main'
        run: |
          node --input-type=module <<'NODE'
          import {spawnSync} from 'node:child_process';
          import {setTimeout} from 'node:timers/promises';
          let result;
          for(let attempt=0;attempt<24;attempt++){
            result=spawnSync(process.execPath,['scripts/test-app-icons.mjs','_site','https://hungjurors.com'],{encoding:'utf8',timeout:90000});
            if(result.status===0){console.log(result.stdout);process.exit(0);}
            console.log('Waiting for the new site deployment ('+(attempt+1)+'/24)');
            await setTimeout(15000);
          }
          console.log(result.stdout||'');
          console.error(result.stderr||result.error);
          process.exit(1);
          NODE
