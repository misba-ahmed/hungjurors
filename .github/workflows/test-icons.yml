name: Verify home screen icons
on:
  push:
    branches: [site-display-fixes, main]
    paths:
      - 'index.html'
      - '*.png'
      - '*.webmanifest'
      - 'scripts/*app-icons.mjs'
      - 'scripts/prepare-site.mjs'
      - '.github/workflows/test-icons.yml'
permissions:
  contents: read
jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install image verification tool
        run: npm install --no-save --package-lock=false sharp@0.34.5
      - name: Generate exact homepage logo icons
        run: node scripts/build-app-icons.mjs
      - name: Read generated icon bytes
        run: |
          node --input-type=module <<'NODE'
          import {readFile} from 'node:fs/promises';
          for(const file of ['apple-touch-icon-hung-jurors-v1.png','hung-jurors-icon-192-v1.png','hung-jurors-icon-512-v1.png']){
            const encoded=(await readFile(file)).toString('base64');
            for(let offset=0;offset<encoded.length;offset+=3000)console.log('ICON_BYTES '+JSON.stringify({file,offset,data:encoded.slice(offset,offset+3000)}));
          }
          for(const path of ['/apple-touch-icon.png?v=20260828a','/icon-192.png?v=20260828a','/site.webmanifest?v=20260828a']){
            const r=await fetch('https://hungjurors.com'+path);
            console.log('PUBLISHED_BEFORE '+path+' '+r.status+' '+r.headers.get('content-type'));
          }
          NODE
