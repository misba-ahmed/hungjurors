name: Verify news expansion
on:
  push:
    branches: [news-spin, main]
    paths:
      - 'scripts/news-spin.js'
      - 'scripts/test-news-spin.mjs'
      - 'styles/news-spin.css'
      - 'scripts/prepare-site.mjs'
      - '.github/workflows/test-news.yml'
permissions:
  contents: read
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify news expansion
        run: |
          node scripts/test-news-spin.mjs
          node scripts/test-record-book.mjs
