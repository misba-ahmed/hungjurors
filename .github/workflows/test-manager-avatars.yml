name: Verify manager avatar framing
on:
  push:
    branches: [avatar-framing-preview]
permissions:
  contents: read
jobs:
  avatar-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false sharp@0.34.5 playwright
      - run: npx playwright install chromium --with-deps
      - run: node scripts/verify-manager-avatar-framing.mjs
