name: Verify zoom stability
on:
  push:
    branches: [main, zoom-stability-preview]
    paths:
      - index.html
      - scripts/folder-artwork.js
      - scripts/site-artwork.mjs
      - scripts/trophy-media.js
      - scripts/player-search.js
      - scripts/test-player-search.mjs
      - scripts/zoom-safety.js
      - scripts/prepare-zoom-safety.mjs
      - scripts/prepare-site.mjs
      - scripts/card-gestures.js
      - scripts/matchup-row-fit.js
      - scripts/player-stat-extras.js
      - scripts/test-zoom-safety.mjs
      - styles/zoom-safety.css
      - .github/workflows/test-zoom-safety.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zoom-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install chromium webkit --with-deps
      - run: xvfb-run -a node scripts/test-zoom-safety.mjs
      - run: xvfb-run -a node scripts/test-card-gestures.mjs

      - run: xvfb-run -a node scripts/test-player-search.mjs
