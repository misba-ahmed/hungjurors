name: Audit original lineup rules
on:
  push:
    branches: [lineup-original-rules-audit]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false sharp
      - run: node scripts/audit-lineup-assets.mjs
      - name: Save report
        run: |
          git config user.name "misba-ahmed"
          git config user.email "misbauddin.ahmed@gmail.com"
          git add .lineup-audit assets/team-photos
          git commit -m "Record lineup height and asset audit"
          git push origin HEAD:lineup-original-rules-audit
