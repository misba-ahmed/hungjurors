name: Check weekly top-five recap
on:
  push:
    branches: ["fix/recap-compact-style"]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install chromium --with-deps
      - run: node --check scripts/recap-live.js && node --check scripts/recap-loader.js
      - run: node scripts/test-recap-top-five.mjs
      - run: |
          git config user.name "Recap preview"
          git config user.email "preview@users.noreply.github.com"
          git add recap-preview
          git commit -m "Save verified recap leaderboard preview"
          git push origin HEAD:refs/heads/fix/recap-compact-style
