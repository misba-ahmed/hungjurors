name: Prepare corrected Wasi player cutouts
on:
  push:
    branches: ["fix/wasi-player-likenesses"]
    paths: ["scripts/process-wasi-faces.mjs", "face-preview/generated-*.png", ".github/workflows/process-wasi-faces.yml"]
permissions:
  contents: write
jobs:
  cutouts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false sharp@0.34.5
      - run: node scripts/process-wasi-faces.mjs
      - run: |
          git config user.name "Roster photo assets"
          git config user.email "preview@users.noreply.github.com"
          git add assets/team-photos/players assets/team-photos/catalog.json face-preview
          git commit -m "Prepare fifteen corrected high resolution player cutouts"
          git push origin HEAD:refs/heads/fix/wasi-player-likenesses
