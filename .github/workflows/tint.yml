name: Verify unavailable player tint
on:
  push:
    branches: [verify-unavailable-tint]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps webkit
      - run: node scripts/test-unavailable-tint.mjs
      - run: |
          git config user.name "misba-ahmed"
          git config user.email "misbauddin.ahmed@gmail.com"
          git add .tint
          git commit -m "Record rendered unavailable tint proof"
          git push origin HEAD:verify-unavailable-tint
