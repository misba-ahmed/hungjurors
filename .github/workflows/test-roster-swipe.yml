name: Check roster and matchup swiping
on:
  push:
    branches: [roster-swipe-wrap]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install chromium
      - run: node scripts/test-roster-swipe.mjs
